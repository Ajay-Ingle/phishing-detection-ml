version: "3.9"

services:

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - mlops-network

  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3000:3000"

    networks:
      - mlops-network

networks:
  mlops-network:
    external: true